name: Agentic Snap Test

on:
  schedule:
    - cron: "40 3 * * 2" # Weekly on Tuesday

jobs:
  ai-test:
    runs-on: ubuntu-latest
    steps:
      - name: Run test
        uses: canonical/inference-snaps-dev/.github/actions/agentic-test@v2
        with:
          snap-name: qwen-vl
          snap-channel: beta
          create-issues: true
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          issue-create-token: ${{ secrets.ISSUE_CREATE_TOKEN }}
